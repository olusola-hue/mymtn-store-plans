<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffcb05">
<title>myMTN NG — Pay Bills</title>
<style>
:root{--mtn-yellow:#ffcb05;--ink:#171717;--muted:#6e7177;--line:#ececec;--soft:#f7f7f7;--green:#17854b}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:460px;min-height:100vh;margin:0 auto;background:#fff;padding-bottom:100px;position:relative}
.status{height:28px;padding:7px 22px 0;font-size:12px;font-weight:700;display:flex;justify-content:space-between}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 16px}
.brand{display:flex;align-items:center;gap:10px}
h1{font-size:23px;letter-spacing:-.6px;margin:0;font-weight:800}
.num-switch{position:relative}
.num-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:750;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.num-btn:focus-visible,.num-opt:focus-visible{outline:2px solid #171717;outline-offset:2px}
.num-chev{width:16px;height:16px;color:#8a8d93;transition:transform .2s;flex-shrink:0}
.num-btn[aria-expanded="true"] .num-chev{transform:rotate(180deg)}
.num-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:8;min-width:220px;max-height:min(60vh,340px);overflow:auto;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid #e9e9e9;border-radius:16px;box-shadow:0 10px 30px #0002}
.num-menu[hidden]{display:none}
.num-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:11px;background:transparent;text-align:left;color:var(--ink)}
.num-opt:hover{background:#f6f6f6}
.num-opt[aria-selected="true"]{background:#fff7cf}
.num-opt b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.num-opt small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.num-opt svg{width:18px;height:18px;color:var(--green);flex-shrink:0}
.search-wrap{padding:0 20px 18px}
.search{height:46px;border:1px solid #e6e6e6;background:#fafafa;border-radius:13px;display:flex;align-items:center;gap:10px;padding:0 13px}
.search svg{width:19px;color:#777;flex-shrink:0}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:14px}
.tabs{display:flex;gap:6px;padding:0 20px 20px;overflow-x:auto}
.tab{border:1px solid #e7e7e7;border-radius:999px;padding:10px 12px;background:#fff;color:#555;white-space:nowrap;font-weight:650;font-size:13px}
.tab.active{background:var(--mtn-yellow);border-color:var(--mtn-yellow);color:#151515}
.section-head{padding:0 20px 13px;display:flex;justify-content:space-between;align-items:center}
.section-head h2{margin:0;font-size:17px;letter-spacing:-.25px}
.count{font-size:12px;color:var(--muted)}
.cards{padding:0 16px;display:grid;gap:13px}
.plan-card{border:1px solid #e9e9e9;border-radius:17px;overflow:hidden;background:#fff;position:relative}
.card-top{padding:17px 16px 13px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.allowance{font-size:25px;font-weight:850;letter-spacing:-.8px;line-height:1.1}
.description{color:#777;font-size:12px;margin-top:7px}
.price{font-size:19px;font-weight:800;white-space:nowrap;text-align:right}
.status-row{display:flex;justify-content:flex-end}
.ribbon{font-size:9px;font-weight:900;letter-spacing:.5px;padding:5px 14px 5px 10px;border-radius:0 0 0 9px;white-space:nowrap}
.ribbon.active{background:#e3f4ea;color:#11663a}
.ribbon.expiring{background:#ffe9bf;color:#8a5200}
.ribbon.expired{background:#fde4e4;color:#b3261e}
.ribbon.exhausted{background:#e6e9f2;color:#3b4766}
.status-row + .card-top{padding-top:12px}
.card-top > div:first-child{min-width:0;overflow-wrap:anywhere}
.plan-card.expandable{cursor:pointer}
.card-top:focus-visible{outline:2px solid #171717;outline-offset:-2px;border-radius:16px}
.price.has-chev{display:flex;align-items:center;gap:6px}
.chev{width:16px;height:16px;color:#8a8d93;flex-shrink:0;transition:transform .2s}
.plan-card.open .chev{transform:rotate(180deg)}
.pay-panel{display:grid;grid-template-rows:0fr;visibility:hidden;cursor:default;transition:grid-template-rows .22s ease,visibility 0s .22s}
.plan-card.open .pay-panel{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .22s ease,visibility 0s}
.pay-inner{overflow:hidden;min-height:0;padding:0 16px}
.pay-btn{width:100%;padding:13px;margin-bottom:16px}
.card-meta{display:flex;align-items:center;justify-content:space-between;padding:2px 16px 16px;gap:8px}
.meta-left{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.meta{display:flex;gap:5px;align-items:center;color:#5f6268;font-size:11px}
.meta svg{width:14px;height:14px}
.timer{padding:9px 16px;background:#fff9dd;border-top:1px solid #f6e8a7;color:#695600;font-size:11px;display:flex;justify-content:space-between;align-items:center}
.timer strong{font-variant-numeric:tabular-nums;letter-spacing:.5px}
.primary{border:0;border-radius:10px;background:var(--mtn-yellow);padding:11px 18px;font-size:12px;font-weight:850;color:#111;min-width:95px}
.primary:active{transform:scale(.98)}
.renew{display:flex;align-items:center;gap:7px;flex-shrink:0}
.renew-label{font-size:11px;font-weight:650;color:#5f6268;white-space:nowrap}
.switch{width:36px;height:21px;border:0;border-radius:999px;background:#cfd1d4;position:relative;padding:0;flex-shrink:0;transition:background .18s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .18s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(15px)}
.switch:focus-visible{outline:2px solid #171717;outline-offset:2px}
.offer{font-size:11px;color:#777}
.empty{padding:36px 20px;text-align:center;color:#777;font-size:14px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);height:82px;background:rgba(255,255,255,.98);border:1px solid #e9e9e9;border-bottom:0;border-radius:22px 22px 0 0;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:9px 8px 12px;z-index:5;box-shadow:0 -5px 24px rgba(0,0,0,.04)}
.nav-item{border:0;background:transparent;color:#858585;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;font-size:10px;font-weight:650;min-width:0;height:54px}
.nav-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-item.active{color:#171717}
.store-slot{position:relative;display:flex;justify-content:center;align-items:flex-end;height:68px}
.store-button{position:absolute;top:-14px;width:59px;height:59px;border-radius:50%;background:var(--mtn-yellow);border:5px solid white;outline:1px solid #e8e8e8;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.store-button svg{width:28px;height:28px;stroke:#111;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.store-label{font-size:10px;font-weight:800;margin-bottom:-1px;color:#111}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#191919;color:white;padding:12px 16px;border-radius:12px;font-size:12px;z-index:9;transition:.22s;max-width:calc(100% - 36px);text-align:center;box-shadow:0 5px 20px #0002}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet-backdrop{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-backdrop.open{display:flex}
.sheet{width:min(460px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 20px 24px;box-shadow:0 -8px 30px #0002;animation:sheetUp .22s ease}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-grab{width:38px;height:4px;border-radius:4px;background:#e2e2e2;margin:0 auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:36px}
.sheet-head h2{margin:0;font-size:19px}
.sheet-head h2:focus{outline:none}
.sheet-x{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;color:#222;flex-shrink:0}
.sheet-x svg{width:18px;height:18px}
.sheet button:focus-visible{outline:2px solid #171717;outline-offset:2px}
.summary{border:1px solid #ececec;border-radius:16px;padding:14px 16px;margin-bottom:16px}
.sum-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
.sum-name{font-size:22px;font-weight:850;letter-spacing:-.5px;overflow-wrap:anywhere}
.sum-type{font-size:12px;color:#777;margin-top:4px}
.sum-price{font-size:19px;font-weight:800;white-space:nowrap}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding-top:10px;font-size:13px}
.sum-row span{color:#686868}
.sum-row strong{text-align:right}
.pay-title{font-size:13px;font-weight:750;margin:0 0 8px}
.methods{display:grid;gap:8px;margin-bottom:16px}
.method{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1.5px solid #e6e6e6;border-radius:14px;background:#fff;text-align:left;color:var(--ink)}
.method[aria-checked="true"]{border-color:var(--mtn-yellow);background:#fffbe6}
.method:disabled{opacity:.55;cursor:not-allowed}
.m-text{flex:1;min-width:0}
.m-text b{display:block;font-size:14px}
.m-text small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.m-text small.bad{color:#b3261e}
.m-radio{width:20px;height:20px;border-radius:50%;border:2px solid #cfd1d4;flex-shrink:0;display:grid;place-items:center}
.method[aria-checked="true"] .m-radio{border-color:#171717}
.method[aria-checked="true"] .m-radio::after{content:"";width:10px;height:10px;border-radius:50%;background:#171717}
.sheet .primary.wide{width:100%;padding:14px}
.sheet .primary:disabled{background:#ececec;color:#9a9a9a;cursor:not-allowed}
.pin-sub{margin:0 0 18px;font-size:13px;color:#686868;line-height:1.5;text-align:center}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:22px}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid #cfd1d4}
.pin-dots span.on{background:#171717;border-color:#171717}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.key{height:56px;border:0;border-radius:14px;background:#f5f5f6;font-size:22px;font-weight:700;color:var(--ink)}
.key:active{background:#ebebec}
.key.ghost{visibility:hidden}
.key svg{width:24px;height:24px}
.pin-hint{text-align:center;font-size:11px;color:#9a9a9a;margin:16px 0 0}
.proc{padding:40px 0 34px;text-align:center}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid #f0f0f0;border-top-color:#171717;margin:0 auto 18px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.proc p{margin:0;font-size:14px;color:#555}
.done-ic{width:64px;height:64px;border-radius:50%;background:#e3f4ea;color:var(--green);display:grid;place-items:center;margin:8px auto 14px}
.done-ic svg{width:32px;height:32px}
.done-title{text-align:center;font-size:20px;font-weight:800;margin:0 0 6px}
.done-title:focus{outline:none}
.done-sub{text-align:center;font-size:13px;color:#686868;line-height:1.55;margin:0 0 18px}
.receipt{border:1px dashed #d9d9d9;border-radius:16px;padding:2px 16px 12px;margin-bottom:16px}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.spinner{animation-duration:2.4s}}
.disclaimer{padding:20px 22px 0;color:#9a9a9a;font-size:10px;line-height:1.5}
@media(min-width:600px){body{background:#f6f6f6;padding:20px 0}.app{border-radius:24px;box-shadow:0 8px 40px #0000;overflow:hidden;min-height:calc(100vh - 40px)}.bottom-nav{bottom:20px;border-radius:22px}.toast{bottom:116px}}
</style>
</head>
<body>
<div class="app">
  <div class="status"><span>9:41</span><span>●●●　▰</span></div>
  <header class="topbar">
    <div class="brand"><h1>Pay Bills</h1></div>
    <div class="num-switch">
      <button class="num-btn" id="numBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Switch number"><span id="numCurrent"></span><svg class="num-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <ul class="num-menu" id="numMenu" role="listbox" aria-label="Your numbers" hidden></ul>
    </div>
  </header>
  <div class="search-wrap"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="searchInput" type="search" placeholder="Search plans or subscriptions…" autocomplete="off"></label></div>
  <div class="tabs" role="tablist" aria-label="Store categories">
    <button class="tab active" data-category="Internet" role="tab" aria-selected="true">Internet</button>
    <button class="tab" data-category="Call & Message" role="tab" aria-selected="false">Call &amp; Message</button>
    <button class="tab" data-category="Entertainment" role="tab" aria-selected="false">Entertainment</button>
  </div>
  <div class="section-head"><h2 id="sectionTitle">Internet bundles</h2><span class="count" id="countLabel">4 plans</span></div>
  <main class="cards" id="cards"></main>
  <p class="disclaimer">Illustrative prototype only. Prices, reward points, availability and promotional countdowns are sample content and do not represent live MTN offers.</p>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" data-nav="Home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="nav-item" data-nav="Play"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4z"/></svg><span>Play</span></button>
    <div class="store-slot"><button class="store-button" data-nav="Pay" aria-label="Pay"><svg viewBox="0 0 24 24"><path d="M19 8V6.5A1.5 1.5 0 0 0 17.5 5H5.5A2.5 2.5 0 0 0 3 7.5V17a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2H5.5A2.5 2.5 0 0 1 3 5.5"/><path d="M16.5 13.5h2.5"/></svg></button><span class="store-label">Pay</span></div>
    <button class="nav-item" data-nav="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.2 1.8c-1.2 1-1.8 1.2-1.8 3M12 17.5h.01"/></svg><span>Help</span></button>
    <button class="nav-item" data-nav="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span>More</span></button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="sheet-backdrop" id="sheetBackdrop"><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-grab"></div><div id="sheetBody"></div></section></div>
<script>
const plans = [
 {category:"Internet",lines:["primary"],name:"30 GB",qty:30,unit:"GB",price:"₦10,000",type:"Monthly Plan",validity:"30 Days",points:"40,055",status:"active",autoRenew:true},
 {category:"Internet",lines:["primary"],name:"15 GB",qty:15,unit:"GB",price:"₦5,000",type:"Betamix Bundle Max",validity:"20 Days",points:"10,500",status:"expiring"},
 {category:"Internet",lines:["primary"],name:"10 GB",qty:10,unit:"GB",price:"₦3,500",type:"Monthly Plan",validity:"30 Days",points:"5,000",status:"exhausted"},
 {category:"Internet",lines:["primary"],name:"5 GB",qty:5,unit:"GB",price:"₦1,500",type:"Weekly Plan",validity:"7 Days",points:"2,500",status:"expired"},
 {category:"Call & Message",lines:["primary"],name:"200 Minutes",qty:200,unit:"Min",price:"₦2,500",type:"Monthly Plan",validity:"30 Days",points:"2,500",status:"active",autoRenew:true},
 {category:"Call & Message",lines:["primary"],name:"100 Minutes",qty:100,unit:"Min",price:"₦1,000",type:"Weekly Plan",validity:"7 Days",points:"1,000",status:"exhausted"},
 {category:"Call & Message",lines:["primary"],name:"50 SMS",qty:50,unit:"SMS",price:"₦300",type:"Weekly Plan",validity:"7 Days",points:"300"},
 {category:"Internet",lines:["fibrex"],name:"FibreX",price:"₦20,000",type:"50Mbps",validity:"30 Days",points:"20,000",status:"active",autoRenew:true},
 {category:"Internet",lines:["flyx"],name:"FlyX (ODU)",price:"₦35,000",type:"100Mbps",validity:"30 Days",points:"35,000",status:"expiring"},
 {category:"Entertainment",lines:["primary"],name:"Netflix",price:"₦5,000",type:"Standard Plan",validity:"30 Days",points:"5,000",status:"active",autoRenew:true},
 {category:"Entertainment",lines:["primary"],name:"Apple Music",price:"₦1,500",type:"Individual Plan",validity:"30 Days",points:"1,500",status:"active"},
 {category:"Entertainment",lines:["primary"],name:"Spotify",price:"₦1,300",type:"Premium Individual",validity:"30 Days",points:"1,300",status:"expiring"},
 {category:"Entertainment",lines:["primary"],name:"DSTV",price:"₦15,700",type:"Compact Plan",validity:"30 Days",points:"15,700",status:"expired"},
 {category:"Internet",lines:["work"],name:"100 GB",qty:100,unit:"GB",price:"₦30,000",type:"Business Monthly Plan",validity:"30 Days",points:"30,000",status:"active",autoRenew:true},
 {category:"Internet",lines:["work"],name:"50 GB",qty:50,unit:"GB",price:"₦17,000",type:"Corporate Bundle",validity:"30 Days",points:"17,000",status:"expiring"},
 {category:"Internet",lines:["work"],name:"20 GB",qty:20,unit:"GB",price:"₦6,000",type:"Business Weekly Plan",validity:"7 Days",points:"6,000",status:"exhausted"},
 {category:"Call & Message",lines:["work"],name:"500 Minutes",qty:500,unit:"Min",price:"₦8,000",type:"Business Voice Plan",validity:"30 Days",points:"8,000",status:"active",autoRenew:true},
 {category:"Call & Message",lines:["work"],name:"1,000 SMS",qty:1000,unit:"SMS",price:"₦2,500",type:"Bulk SMS Bundle",validity:"30 Days",points:"2,500",status:"expired"}
];
const SHARE_MAX=0.2;
const shareText=item=>{const v=Math.round(item.qty*SHARE_MAX*10)/10;return "Share up to "+v+" "+item.unit};
const statusLabels={active:"ACTIVE",expiring:"EXPIRING SOON",expired:"EXPIRED",exhausted:"EXHAUSTED"};
let currentCategory="Internet";
const cards=document.getElementById("cards"), searchInput=document.getElementById("searchInput");
const icon=(type)=> type==="share" ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.3 10.8 7.4-4.4M8.3 13.2l7.4 4.4"/></svg>' : type==="calendar" ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4.5 6v5.5c0 4.5 3.2 7.8 7.5 9.5 4.3-1.7 7.5-5 7.5-9.5V6z"/><path d="m8.5 12 2.3 2.3 4.8-5"/></svg>';
function render(){
 const q=searchInput.value.trim().toLowerCase();
 let items=plans.filter(p=>p.category===currentCategory&&belongsToActive(p)).filter(x=>(x.name+" "+x.type).toLowerCase().includes(q));
 document.getElementById("sectionTitle").textContent=currentCategory==="Internet"?"Internet bundles":currentCategory==="Call & Message"?"Call & message bundles":"Entertainment subscriptions";
 document.getElementById("countLabel").textContent=items.length+" "+(currentCategory==="Entertainment"?"subscription":currentCategory==="Internet"?"plan":"bundle")+(items.length===1?"":"s");
 cards.innerHTML="";
 if(!items.length){cards.innerHTML='<div class="empty">'+(q?"No results found. Try a different search.":"Nothing here for this number.")+'</div>';return}
 items.forEach(item=>{
  const el=document.createElement("article");el.className="plan-card";
   const st=statusLabels[item.status];
   const ribbon=st?`<div class="status-row"><span class="ribbon ${item.status}">${st}</span></div>`:"";
   const action=(item.status==="active"||item.status==="expiring")?"Stack Plan":(item.status==="expired"||item.status==="exhausted")?"Renew Plan":null;
   const chev=action?'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>':"";
   el.innerHTML=`${ribbon}<div class="card-top"${action?' tabindex="0" role="button" aria-expanded="false"':""}><div><div class="allowance">${item.name}</div><div class="description">${item.type}</div></div><div class="price${action?" has-chev":""}">${item.price}${chev}</div></div><div class="card-meta"><div class="meta-left"><span class="meta">${icon("calendar")} ${item.validity}</span>${item.category==="Internet"&&item.qty?`<span class="meta">${icon("share")} ${shareText(item)}</span>`:""}</div><div class="renew"><span class="renew-label">Auto-renewal</span><button class="switch" role="switch" aria-checked="${!!item.autoRenew}" aria-label="Auto-renewal for ${item.name}"></button></div></div>${item.timer?`<div class="timer"><span>Limited-time offer ends in</span><strong>${item.timer}</strong></div>`:""}${action?`<div class="pay-panel"><div class="pay-inner"><button class="primary pay-btn">${action}</button></div></div>`:""}`;
   const sw=el.querySelector(".switch");
   sw.addEventListener("click",()=>{item.autoRenew=!item.autoRenew;sw.setAttribute("aria-checked",item.autoRenew);toast("Auto-renewal turned "+(item.autoRenew?"on":"off")+" for "+item.name+".")});
   if(action){
    const top=el.querySelector(".card-top");
    el.classList.add("expandable");
    const toggleCard=()=>{const open=el.classList.toggle("open");top.setAttribute("aria-expanded",open)};
    el.addEventListener("click",e=>{if(e.target.closest(".renew,.pay-panel"))return;toggleCard()});
    top.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleCard()}});
    const payBtn=el.querySelector(".pay-btn");payBtn.addEventListener("click",()=>openCheckout(item,action,payBtn));
   }
  cards.appendChild(el);
 });
}
document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{currentCategory=btn.dataset.category;document.querySelectorAll(".tab").forEach(t=>{let active=t===btn;t.classList.toggle("active",active);t.setAttribute("aria-selected",active)});render()}));
searchInput.addEventListener("input",render);
document.querySelectorAll("[data-nav]").forEach(btn=>btn.addEventListener("click",()=>{const dest=btn.dataset.nav;if(dest==="Pay"){toast("You're already in Pay.");return}toast(dest+" navigation is a prototype placeholder.")}));
let toastTimer;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2800)}
const numbers=[
 {id:"primary",number:"0803 555 0142",label:"Primary"},
 {id:"work",number:"0813 555 0187",label:"Work"},
 {id:"fibrex",number:"0706 555 0153",label:"FibreX",dedicated:true},
 {id:"flyx",number:"0816 555 0164",label:"FlyX (ODU)",dedicated:true}
];
const belongsToActive=item=>item.lines.includes(numbers[activeNumber].id);
let activeNumber=0;
const numBtn=document.getElementById("numBtn"),numMenu=document.getElementById("numMenu"),numCurrent=document.getElementById("numCurrent");
const checkIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
function renderNumbers(){
 numCurrent.textContent=numbers[activeNumber].number;
 numMenu.innerHTML=numbers.map((n,i)=>`<li role="presentation"><button class="num-opt" role="option" data-i="${i}" aria-selected="${i===activeNumber}"><span><b>${n.number}</b><small>${n.label}</small></span>${i===activeNumber?checkIcon:""}</button></li>`).join("");
}
function setNumMenu(open){numMenu.hidden=!open;numBtn.setAttribute("aria-expanded",open);if(open){const sel=numMenu.querySelector('[aria-selected="true"]');sel&&sel.focus()}}
numBtn.addEventListener("click",()=>setNumMenu(numMenu.hidden));
numMenu.addEventListener("click",e=>{const b=e.target.closest(".num-opt");if(!b)return;activeNumber=+b.dataset.i;renderNumbers();setNumMenu(false);numBtn.focus();const n=numbers[activeNumber];if(!plans.some(p=>p.category===currentCategory&&belongsToActive(p)))document.querySelector('.tab[data-category="Internet"]').click();else render();toast("Switched to "+n.number+(n.dedicated?" ("+n.label+")":"")+".")});
numMenu.addEventListener("keydown",e=>{const opts=[...numMenu.querySelectorAll(".num-opt")],i=opts.indexOf(document.activeElement);if(e.key==="ArrowDown"){e.preventDefault();opts[(i+1)%opts.length].focus()}else if(e.key==="ArrowUp"){e.preventDefault();opts[(i-1+opts.length)%opts.length].focus()}});
document.addEventListener("click",e=>{if(!numMenu.hidden&&!e.target.closest(".num-switch"))setNumMenu(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!numMenu.hidden){setNumMenu(false);numBtn.focus()}});

/* ---------- Checkout: review -> PIN -> processing -> receipt ---------- */
const wallet={momo:50000,airtime:1200};
const payMethods=[{id:"momo",name:"MoMo Wallet"},{id:"airtime",name:"Airtime"},{id:"card",name:"Debit card",sub:"Card ending 4242"}];
const priceOf=item=>Number(String(item.price).replace(/[^\d]/g,""));
const naira=n=>"₦"+n.toLocaleString("en-NG");
const sheetBackdrop=document.getElementById("sheetBackdrop"),sheetBody=document.getElementById("sheetBody");
const appRoot=document.querySelector(".app");
const ic={x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
 del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m13 9 4 6M17 9l-4 6"/></svg>',
 ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'};
let flow=null,lastOpener=null,procTimer=null;
const methodOk=m=>m.id==="card"||wallet[m.id]>=priceOf(flow.item);
const methodOf=id=>payMethods.find(m=>m.id===id);
function openCheckout(item,action,opener){
 flow={item,action,method:null,pin:"",step:"review"};
 const first=payMethods.find(methodOk);flow.method=first?first.id:null;
 lastOpener=opener;sheetBackdrop.classList.add("open");appRoot.inert=true;document.body.style.overflow="hidden";showStep();
}
function closeCheckout(){
 clearTimeout(procTimer);flow=null;sheetBackdrop.classList.remove("open");appRoot.inert=false;document.body.style.overflow="";
 if(lastOpener&&document.contains(lastOpener))lastOpener.focus();
}
function showStep(){
 const f=flow,item=f.item,num=numbers[activeNumber],price=priceOf(item),stack=f.action==="Stack Plan";
 let html="";
 if(f.step==="review"){
  html=`<div class="sheet-head"><h2 id="sheetTitle" tabindex="-1">${f.action}</h2><button class="sheet-x" data-act="close" aria-label="Close">${ic.x}</button></div>
  <div class="summary"><div class="sum-top"><div><div class="sum-name">${item.name}</div><div class="sum-type">${item.type}</div></div><div class="sum-price">${item.price}</div></div>
  <div class="sum-row"><span>Number</span><strong>${num.number}${num.dedicated?" · "+num.label:""}</strong></div>
  <div class="sum-row"><span>Validity</span><strong>${item.validity}</strong></div>
  <div class="sum-row"><span>Starts</span><strong>${stack?"When your current plan ends":"Immediately"}</strong></div>
  <div class="sum-row"><span>Total</span><strong>${item.price}</strong></div></div>
  <p class="pay-title">Pay with</p>
  <div class="methods" role="radiogroup" aria-label="Payment method">${payMethods.map(m=>{const ok=methodOk(m);const sub=m.sub||("Balance "+naira(wallet[m.id]));return `<button class="method" role="radio" data-act="method" data-id="${m.id}" aria-checked="${f.method===m.id}"${ok?"":" disabled"}><span class="m-text"><b>${m.name}</b><small${ok?"":' class="bad"'}>${ok?sub:"Insufficient balance · "+sub.replace("Balance ","")}</small></span><span class="m-radio"></span></button>`}).join("")}</div>
  <button class="primary wide" data-act="pay"${f.method?"":" disabled"}>Pay ${item.price}</button>`;
 }else if(f.step==="pin"){
  const m=methodOf(f.method);
  html=`<div class="sheet-head"><button class="sheet-x" data-act="back" aria-label="Back">${ic.back}</button><h2 id="sheetTitle" tabindex="-1">Enter your PIN</h2><span style="width:36px"></span></div>
  <p class="pin-sub">Confirm payment of <b>${item.price}</b> from ${m.name}.</p>
  <div class="pin-dots" id="pinDots" role="img" aria-label="0 of 4 digits entered"><span></span><span></span><span></span><span></span></div>
  <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button class="key" data-key="${k}">${k}</button>`).join("")}<span class="key ghost" aria-hidden="true"></span><button class="key" data-key="0">0</button><button class="key" data-key="back" aria-label="Delete">${ic.del}</button></div>
  <p class="pin-hint">Prototype: any 4 digits work.</p>`;
 }else if(f.step==="proc"){
  html=`<div class="proc" role="status"><div class="spinner" aria-hidden="true"></div><p>Processing your payment…</p></div>`;
 }else{
  const m=methodOf(f.method);
  html=`<div class="done-ic">${ic.ok}</div><h2 class="done-title" id="sheetTitle" tabindex="-1">${stack?"Plan stacked":"Plan renewed"}</h2>
  <p class="done-sub">${stack?`Your new ${item.name} bundle starts when your current plan ends.`:`Your ${item.name} plan is active again for ${item.validity}.`}</p>
  <div class="receipt"><div class="sum-row"><span>Reference</span><strong>${f.ref}</strong></div><div class="sum-row"><span>Date</span><strong>${f.when}</strong></div><div class="sum-row"><span>Number</span><strong>${num.number}</strong></div><div class="sum-row"><span>Plan</span><strong>${item.name} · ${item.type}</strong></div><div class="sum-row"><span>Paid with</span><strong>${m.name}</strong></div><div class="sum-row"><span>Amount paid</span><strong>${item.price}</strong></div></div>
  <button class="primary wide" data-act="done">Done</button>`;
 }
 sheetBody.innerHTML=html;
 const h=document.getElementById("sheetTitle");if(h)h.focus();
}
function updatePinDots(){
 const dots=document.querySelectorAll("#pinDots span");dots.forEach((d,i)=>d.classList.toggle("on",i<flow.pin.length));
 document.getElementById("pinDots").setAttribute("aria-label",flow.pin.length+" of 4 digits entered");
}
function pressKey(k){
 if(!flow||flow.step!=="pin")return;
 if(k==="back")flow.pin=flow.pin.slice(0,-1);else if(flow.pin.length<4)flow.pin+=k;
 updatePinDots();
 if(flow.pin.length===4)setTimeout(()=>{if(flow&&flow.step==="pin"){flow.step="proc";showStep();procTimer=setTimeout(finishPayment,1600)}},180);
}
function finishPayment(){
 const f=flow,item=f.item,price=priceOf(item);
 if(f.method!=="card")wallet[f.method]-=price;
 item.status="active";
 f.ref="MTN"+String(Math.floor(Math.random()*1e9)).padStart(9,"0");
 f.when=new Date().toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
 f.step="done";showStep();render();
}
sheetBody.addEventListener("click",e=>{
 if(!flow)return;
 const k=e.target.closest("[data-key]");if(k){pressKey(k.dataset.key);return}
 const a=e.target.closest("[data-act]");if(!a)return;
 const act=a.dataset.act;
 if(act==="close"||act==="done")closeCheckout();
 else if(act==="method"){flow.method=a.dataset.id;showStep();const sel=sheetBody.querySelector('.method[aria-checked="true"]');sel&&sel.focus()}
 else if(act==="pay"&&flow.method){flow.step="pin";flow.pin="";showStep()}
 else if(act==="back"){flow.step="review";flow.pin="";showStep()}
});
sheetBackdrop.addEventListener("click",e=>{if(e.target===sheetBackdrop&&flow&&flow.step!=="proc")closeCheckout()});
document.addEventListener("keydown",e=>{
 if(!flow)return;
 if(e.key==="Escape"&&flow.step!=="proc"){closeCheckout();return}
 if(flow.step==="pin"){if(/^[0-9]$/.test(e.key)){e.preventDefault();pressKey(e.key)}else if(e.key==="Backspace"){e.preventDefault();pressKey("back")}}
});
renderNumbers();
render();
</script>
</body>
</html>
